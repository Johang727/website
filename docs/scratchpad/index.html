    <script>
        function hash(str) {
            let h = 0;
            for (let i = 0; i < str.length; i++) {
                h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
            }
            return Math.abs(h);
        }
 
        const palettes = [
            { light: ['#fdf6e3', '#2c1a0e', '#7a5c3e'], dark: ['#2c2014', '#e8d8c0', '#9a7a58'] },
            { light: ['#fef9c3', '#3d2b00', '#92742a'], dark: ['#2a2200', '#f5e88a', '#b09040'] },
            { light: ['#d1fae5', '#064e3b', '#2d7a5f'], dark: ['#0a2e20', '#8fffd4', '#4daa80'] },
            { light: ['#e8f4fd', '#0c3a5c', '#3a6e94'], dark: ['#091e30', '#a8d8f8', '#5090c0'] },
            { light: ['#fce7f3', '#4a0e2e', '#9a3060'], dark: ['#2a0818', '#f8b8d8', '#c06080'] },
            { light: ['#ede9fe', '#2e1065', '#6d28d9'], dark: ['#1a0a38', '#c4b5fd', '#8060d0'] },
        ];
 
        function applyNoteColors() {
            const isDark = document.body.classList.contains('dark-mode');
            document.querySelectorAll('.note-card').forEach(el => {
                const href = el.closest('.note')?.getAttribute('href') || '';
                const p = palettes[hash(href) % palettes.length];
                const [bg, titleCol, muted] = isDark ? p.dark : p.light;
                el.style.setProperty('--note-bg', bg);
                el.style.setProperty('--note-title', titleCol);
                el.style.setProperty('--note-muted', muted);
            });
        }
 
        // Patch toggle_theme to also recolor notes after theme.js defines it
        document.addEventListener('DOMContentLoaded', () => {
            applyNoteColors();
            const orig = toggle_theme;
            toggle_theme = function() {
                orig();
                applyNoteColors();
            };
        });
    </script>
