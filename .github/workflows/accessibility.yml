name: Accessibility Checker
on: [push]

jobs:
  check-a11y:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Run accessibility audit in Playwright container
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.42.0-jammy \
            /bin/bash -c 'npm install -g serve && serve docs -l 3000 & sleep 5 && npx pa11y-ci --config /work/.pa11yci --sitemap http://localhost:3000/sitemap.xml --sitemap-find https://johang.dev --sitemap-replace http://localhost:3000'

      - name: Show pa11y output
        if: always()
        run: cat /tmp/pa11y-output.txt