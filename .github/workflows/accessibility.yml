name: Accessibility Checker
on: [push]

jobs:
  check-a11y:
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Run accessibility audit in Playwright container
        run: |
          HOST_PATH="${{ github.workspace }}"
          HOST_PATH="${HOST_PATH/\/tmp\/runner-work/$HOST_WORKDIR}"
          docker run --rm \
            --network host \
            -v "$HOST_PATH:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.42.0-jammy \
            /bin/bash -c 'npm install -g serve && serve docs -l 3000 > /dev/null 2>&1 & sleep 5 && npx pa11y-ci --config /work/.pa11yci --sitemap http://localhost:3000/sitemap.xml --sitemap-find https://johang.dev --sitemap-replace http://localhost:3000' > ${{ github.workspace }}/pa11y-output.txt 2>&1

      - name: Post results as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT=$(sed -n '/Running Pa11y/,$p' ${{ github.workspace }}/pa11y-output.txt)
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -f body="## Accessibility Audit Results
          \`\`\`
          $OUTPUT
          \`\`\`"