name: Accessibility Checker
on: [push]

jobs:
  check-a11y:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Run accessibility audit in Playwright container
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.42.0-jammy \
            /bin/bash -c "
              npm install -g serve pa11y-ci && \
              ls -la /work && \
              ls -la /work/docs && \
              serve docs -l 3000 & \
              for i in \$(seq 1 30); do curl -sf http://localhost:3000 > /dev/null && break; sleep 1; done && \
              pa11y-ci --config /work/.pa11yci --sitemap 'http://localhost:3000/sitemap.xml' --sitemap-find 'https://johang.dev' --sitemap-replace 'http://localhost:3000'
            "